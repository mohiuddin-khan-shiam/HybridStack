name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: |
          find . -name '*.py' -not -path './.git/*' | xargs python -m py_compile

      - name: Validate notebook format
        run: |
          pip install nbformat
          python -c "
          import nbformat
          import glob
          import sys
          errors = []
          for nb_path in glob.glob('**/*.ipynb', recursive=True):
              if '.ipynb_checkpoints' in nb_path:
                  continue
              try:
                  with open(nb_path, 'r', encoding='utf-8') as f:
                      nbformat.read(f, as_version=4)
              except Exception as e:
                  errors.append(f'{nb_path}: {e}')
          if errors:
              print('Notebook validation errors:')
              for e in errors:
                  print(f'  - {e}')
              sys.exit(1)
          else:
              print('All notebooks valid.')
          "
